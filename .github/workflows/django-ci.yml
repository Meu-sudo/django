name: Django CI/CD with Docker

on:
  push:
    branches: ["*"]        # run on any branch including feature branches
  pull_request:
    branches: [ main ]     # run on PRs targeting main

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd my/mysite
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          cd my/mysite
          python manage.py migrate

      - name: Run tests
        run: |
          cd my/mysite
          python manage.py test

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test   # Only run if the 'test' job passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t my-django-app my/mysite

      - name: Push Docker image to Docker Hub
        run: |
          docker tag my-django-app ${{ secrets.DOCKER_HUB_USERNAME }}/my-django-app:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/my-django-app:latest
