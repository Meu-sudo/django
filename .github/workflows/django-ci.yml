name: Django Lambda CI/CD (China Region)

on:
  push:
    branches:
      - main   # deploy only from main branch

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          cd my/mysite
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install zappa

      # 4. Run migrations and tests
      - name: Run migrations and tests
        run: |
          cd my/mysite
          python manage.py migrate
          python manage.py test

      - name: Deploy to Lambda using Zappa
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ZAPPA_BUCKET: ${{ secrets.ZAPPA_BUCKET }}
        run: |
          cd my/mysite
          zappa deploy dev --settings_file zappa_settings.json || zappa update dev --settings_file zappa_settings.json
          
